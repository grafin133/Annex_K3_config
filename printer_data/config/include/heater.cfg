# ---------------- Heated Bed ----------------  

[heater_bed]
## connected to SSR Pin - HE1
heater_pin: BED
sensor_type: NTC 100K MGB18-104F39050L32 # Kenovo thermistor
## connected to ThermistorB - J44
sensor_pin: TB
smooth_time: 3.0
max_power: 0.80
min_temp: 0
max_temp: 130

# -------------- Heated Chamber --------------  

[heater_generic chamber_heater]
heater_pin: HE2
max_power: 0.25
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: T1
control: pid
pid_Kp: 63.418               # Run PID tune for your heater
pid_Ki: 0.960
pid_Kd: 1244.716
min_temp: 0
max_temp: 85                 # Safety limit

[verify_heater chamber_heater]
max_error: 800
check_gain_time: 240
hysteresis: 5
heating_gain: 0.5