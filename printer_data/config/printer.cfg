[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_2A0028001051313234353230-if00

[gcode_arcs]
resolution: 0.1

[printer]
kinematics: cartesian
max_velocity: 900
max_accel: 11000 # change this to 7500 after commissioning
max_z_velocity: 60   # may be able to increase to 15 after comissioning.
max_z_accel: 300
square_corner_velocity: 12.0 # start at 8, but then increase once you're sure assembly is sound

[exclude_object]

[input_shaper]
shaper_freq_x: 80.2
shaper_type_x: mzv
shaper_freq_y: 93.4
shaper_type_y: mzv

[include stepper.cfg]
[include extruder.cfg]
[include cartographer.cfg]
[include include/*.cfg]
[include mainsail.cfg]
[include timelapse.cfg]


[force_move]
enable_force_move: True

